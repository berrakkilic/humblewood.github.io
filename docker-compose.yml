services:
  humblewood-table:
    build: .
    container_name: humblewood-table
    ports:
      - "3000:3000"
    environment:
      DM_PIN: ${DM_PIN:-humblewood}
    volumes:
      - humblewood-data:/app/data
      - humblewood-uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  humblewood-data:
  humblewood-uploads:
