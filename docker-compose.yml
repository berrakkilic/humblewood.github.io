services:
  humblewood-table:
    build: .
    container_name: humblewood-table
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DM_PIN: ${DM_PIN:?Set DM_PIN to a unique value before starting the container}
    volumes:
      - humblewood-data:/app/data
      - humblewood-uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  humblewood-data:
  humblewood-uploads:
