<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Humblewood Table</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="join-screen">
  <div class="join-card">
    <h1>The Humblewood Table</h1>
    <p class="sub hand">a cozy corner of the forest</p>

    <div class="field">
      <label for="name-input">Your name</label>
      <input type="text" id="name-input" placeholder="Wren, keeper of maps...">
    </div>

    <div class="field">
      <label>I am the...</label>
      <div class="role-toggle">
        <button id="role-dm" class="active" data-role="dm">Dungeon Master</button>
        <button id="role-player" data-role="player">Player</button>
      </div>
    </div>

    <button class="btn-primary" id="join-btn">Enter the Wood</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div style="display:flex; align-items:center;">
      <h1>🌿 The Humblewood Table</h1>
      <span class="tagline">where the wysteria grows beneath</span>
    </div>
    <div class="topbar-right">
      <span id="presence-list"></span>
      <span class="role-pill" id="my-role-pill"></span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="map">Map</button>
    <button class="tab-btn" data-view="characters">Characters</button>
    <button class="tab-btn" data-view="jukebox">Jukebox</button>
    <button class="tab-btn" data-view="dice">Dice</button>
    <button class="tab-btn" data-view="initiative">Initiative</button>
  </nav>

  <main>
    <!-- MAP VIEW -->
    <section id="view-map" class="view active">
      <aside class="token-tray panel">
        <div class="dm-only">
          <h3>Set the scene</h3>
          <input type="file" id="map-upload" accept="image/*" style="margin-bottom:6px;">
          <button class="btn-ghost" id="clear-doodles-btn" style="width:100%;">Clear doodles</button>
        </div>
        <div class="vine-divider dm-only"></div>

        <h3>NPCs & items</h3>
        <div class="dm-only" style="display:flex; flex-direction:column; gap:6px;">
          <input type="text" id="token-name" placeholder="Token name">
          <select id="token-kind">
            <option value="npc">NPC</option>
            <option value="item">Item</option>
            <option value="pc">Player character</option>
          </select>
          <input type="file" id="token-image" accept="image/*">
          <button class="btn-rose" id="add-token-btn">Add to tray</button>
        </div>
        <div class="vine-divider"></div>
        <div class="token-list" id="token-list"></div>
      </aside>

      <div class="map-stage-wrap" id="map-stage-wrap">
        <div class="map-toolbar">
          <button id="tool-move" class="active">Move</button>
          <button id="tool-pan">Pan</button>
          <button id="tool-doodle" class="dm-only">Doodle</button>
          <input type="color" id="doodle-color" value="#d98a9e" class="dm-only" style="width:30px; border:none; background:none;">
          <button id="undo-doodle-btn" class="dm-only" title="Undo last doodle stroke">Undo</button>
        </div>
        <div class="map-toolbar map-toolbar-right dm-only">
          <label class="grid-toggle"><input type="checkbox" id="grid-toggle"> Grid</label>
          <input type="number" id="grid-size" value="50" min="10" max="300" title="Grid size (px)" style="width:56px;">
          <label class="grid-toggle"><input type="checkbox" id="snap-toggle"> Snap</label>
        </div>
        <div class="map-toolbar map-toolbar-bottom">
          <button id="zoom-out">−</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-in">+</button>
          <button id="zoom-reset">Reset view</button>
        </div>
        <div id="map-stage">
          <img id="map-image" src="" style="display:none;">
          <div id="grid-overlay"></div>
          <canvas id="doodle-canvas"></canvas>
        </div>
        <div class="empty-map" id="empty-map">
          <span style="font-size:40px;">🗺️</span>
          <p class="hand" style="font-size:20px;">No map has bloomed here yet</p>
        </div>
      </div>
    </section>

    <!-- CHARACTERS VIEW -->
    <section id="view-characters" class="view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2>Character sheets</h2>
        <button class="btn-primary" style="width:auto; padding:10px 18px;" id="new-sheet-btn">+ New character</button>
      </div>
      <div class="char-grid" id="char-grid"></div>

      <div id="sheet-editor" class="panel hidden" style="margin-top:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 id="sheet-editor-title">Character sheet</h3>
          <div>
            <button class="btn-rose" id="delete-sheet-btn">Delete</button>
            <button class="btn-ghost" id="close-sheet-btn">Close</button>
          </div>
        </div>
        <div class="vine-divider"></div>
        <form class="sheet-form" id="sheet-form">
          <div class="field span-2 portrait-field">
            <label>Portrait</label>
            <div class="portrait-row">
              <div class="portrait-preview" id="portrait-preview">🍃</div>
              <input type="file" id="sf-portrait" accept="image/*">
            </div>
          </div>
          <div class="field span-2"><label>Name</label><input type="text" id="sf-name"></div>

          <div class="field">
            <label>Species of the Wood</label>
            <input type="text" id="sf-species" list="species-suggestions" placeholder="Avenil, Grimalkin, Vulpal...">
            <datalist id="species-suggestions">
              <option value="Luma (birdfolk)">
              <option value="Corvum (birdfolk)">
              <option value="Raptor (birdfolk)">
              <option value="Gallus (birdfolk)">
              <option value="Strig (birdfolk)">
              <option value="Vulpin (humblefolk)">
              <option value="Mapach (humblefolk)">
              <option value="Jerbeen (humblefolk)">
              <option value="Hedge (humblefolk)">
              <option value="Cervan (humblefolk)">
            </datalist>
          </div>
          <div class="field">
            <label>Path</label>
            <input type="text" id="sf-path" list="path-suggestions" placeholder="Duelist, Ranger, Mystic...">
            <datalist id="path-suggestions">
              <option value="Duelist">
              <option value="Marksman">
              <option value="Mystic">
              <option value="Ranger">
              <option value="Rogue">
              <option value="Warden">
              <option value="Wanderer">
            </datalist>
          </div>
          <div class="field"><label>Class</label><input type="text" id="sf-class"></div>
          <div class="field"><label>Level</label><input type="number" id="sf-level" value="1"></div>

          <div class="field span-2"><label>Home (grove, roost, or den)</label><input type="text" id="sf-home" placeholder="A hollow beneath Cedarfall Hollow..."></div>
          <div class="field"><label>HP / Max HP</label>
            <div style="display:flex; gap:6px;">
              <input type="number" id="sf-hp" value="10">
              <input type="number" id="sf-maxhp" value="10">
            </div>
          </div>
          <div class="field"><label>AC</label><input type="number" id="sf-ac" value="10"></div>
          <div class="field"><label>Speed</label><input type="text" id="sf-speed" value="30 ft"></div>

          <div class="field span-4">
            <label>Ability scores</label>
            <div class="ability-grid">
              <div class="ability-box"><label>STR</label><input type="number" id="sf-str" value="10"></div>
              <div class="ability-box"><label>DEX</label><input type="number" id="sf-dex" value="10"></div>
              <div class="ability-box"><label>CON</label><input type="number" id="sf-con" value="10"></div>
              <div class="ability-box"><label>INT</label><input type="number" id="sf-int" value="10"></div>
              <div class="ability-box"><label>WIS</label><input type="number" id="sf-wis" value="10"></div>
              <div class="ability-box"><label>CHA</label><input type="number" id="sf-cha" value="10"></div>
            </div>
          </div>

          <div class="field"><label>Trait</label><textarea id="sf-trait" rows="2" placeholder="A habit, quirk, or mannerism..."></textarea></div>
          <div class="field"><label>Ideal</label><textarea id="sf-ideal" rows="2" placeholder="What they believe in..."></textarea></div>
          <div class="field"><label>Bond</label><textarea id="sf-bond" rows="2" placeholder="Who or what they're tied to..."></textarea></div>
          <div class="field"><label>Flaw</label><textarea id="sf-flaw" rows="2" placeholder="A weakness or vice..."></textarea></div>

          <div class="field span-4">
            <label>Inventory</label>
            <div id="inventory-list"></div>
            <div class="inventory-add-row">
              <input type="text" id="inv-item-name" placeholder="Item name">
              <input type="number" id="inv-item-qty" placeholder="Qty" value="1" min="1" style="width:70px;">
              <button type="button" class="btn-ghost" id="inv-add-btn">+ Add</button>
            </div>
          </div>

          <div class="field span-4"><label>Notes & backstory</label><textarea id="sf-notes" rows="3"></textarea></div>

          <div class="field span-4">
            <button type="button" class="btn-primary" id="save-sheet-btn">Save character</button>
            <p class="sheet-owner-note" id="sheet-owner-note"></p>
          </div>
        </form>
      </div>
    </section>

    <!-- JUKEBOX VIEW -->
    <section id="view-jukebox" class="view">
      <div class="jukebox-panel panel">
        <div class="jukebox-art" id="jukebox-art"></div>
        <div class="now-playing" id="now-playing">Nothing playing</div>
        <div class="sub" id="now-playing-sub"></div>
        <div class="transport">
          <button id="jb-prev">⏮</button>
          <button class="play-pause" id="jb-playpause">▶</button>
          <button id="jb-next">⏭</button>
        </div>

        <audio id="audio-el"></audio>

        <div class="vine-divider"></div>
        <div class="playlist" id="playlist"></div>

        <div class="add-row dm-only">
          <input type="text" id="track-title" placeholder="Track name">
          <input type="url" id="track-url" placeholder="Audio URL (mp3, ogg...)">
          <button class="btn-rose" id="add-track-btn">Add</button>
        </div>
      </div>
    </section>

    <!-- DICE VIEW -->
    <section id="view-dice" class="view">
      <div class="dice-panel panel">
        <h2>Roll the bones</h2>
        <div class="dice-quick-row">
          <button class="die-btn" data-sides="4">d4</button>
          <button class="die-btn" data-sides="6">d6</button>
          <button class="die-btn" data-sides="8">d8</button>
          <button class="die-btn" data-sides="10">d10</button>
          <button class="die-btn" data-sides="12">d12</button>
          <button class="die-btn" data-sides="20">d20</button>
          <button class="die-btn" data-sides="100">d100</button>
        </div>

        <div class="dice-custom-row">
          <label>Count</label>
          <input type="number" id="dice-count" value="1" min="1" max="20">
          <label>Sides</label>
          <input type="number" id="dice-sides" value="20" min="2" max="1000">
          <label>Modifier</label>
          <input type="number" id="dice-mod" value="0">
          <button class="btn-rose" id="roll-custom-btn">Roll</button>
        </div>

        <div class="vine-divider"></div>
        <h3>Roll log</h3>
        <div class="roll-log" id="roll-log"></div>
      </div>
    </section>

    <!-- INITIATIVE VIEW -->
    <section id="view-initiative" class="view">
      <div class="initiative-panel panel">
        <div class="initiative-header">
          <h2>Turn order</h2>
          <div class="round-badge">Round <span id="init-round">1</span></div>
        </div>

        <div class="dm-only initiative-add-row">
          <input type="text" id="init-name" placeholder="Combatant name">
          <input type="number" id="init-value" placeholder="Initiative">
          <button class="btn-rose" id="init-add-btn">Add</button>
        </div>
        <div class="dm-only initiative-quick-add" id="init-quick-add"></div>

        <div class="vine-divider"></div>
        <div class="initiative-list" id="initiative-list"></div>

        <div class="dm-only initiative-controls">
          <button class="btn-primary" style="width:auto; padding:10px 20px;" id="init-next-btn">Next turn →</button>
          <button class="btn-ghost" id="init-reset-btn">Reset</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
